name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只读；往 Release 上传 zip 需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # build.ps1 builds the pure-C++ background service + the WinUI
      # client (NativeAOT), bundles both into the UI publish folder, and packages a
      # zip into dist/. Requires the VS C++ build tools + Windows SDK (on windows-latest).
      - name: Publish (NativeAOT Release + package)
        shell: pwsh
        run: ./build.ps1 -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: honor-helper-win-x64
          path: dist/honor-helper-win-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/honor-helper-win-x64.zip
