name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只读；往 Release 上传 zip 需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # 先跑一次 Debug，尽早暴露编译错误
      - name: Build (Debug)
        run: dotnet build honor-helper.csproj -c Debug -p:Platform=x64

      # Release 走 build.ps1：NativeAOT publish + 裁剪未用语言资源
      - name: Publish (NativeAOT Release)
        shell: pwsh
        run: ./build.ps1 -c Release

      - name: Zip publish output
        shell: pwsh
        run: |
          $out = "bin/x64/Release/net8.0-windows10.0.26100.0/win-x64/publish"
          Compress-Archive -Path "$out/*" -DestinationPath "honor-helper-win-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: honor-helper-win-x64
          path: honor-helper-win-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: honor-helper-win-x64.zip
